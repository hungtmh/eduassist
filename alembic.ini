; Schema migrations. Usually not called directly: `uv run eduassist-setup` runs `upgrade head`.
;   uv run alembic upgrade head          # apply all revisions
;   uv run alembic revision -m "message" # new revision in migrations/versions
; Database URL comes from DATABASE_URL (see migrations/env.py). Keep this file ASCII:
; Alembic reads it with the OS locale encoding (cp1252 on Windows).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
