[project]
name = "eduassist"
version = "0.1.0"
description = "Trợ lý AI multi-agent cho trung tâm đào tạo: RAG, Text-to-SQL an toàn, human-in-the-loop"
readme = "README.md"
authors = [
    { name = "hungtmh", email = "hungtmh20002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "redis>=5.2",
    "sqlalchemy>=2.1.8",
    "sqlglot>=30.27.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
eduassist-setup = "eduassist.scripts.setup:main"
eduassist-chat = "eduassist.cli:main"
eduassist-eval = "eduassist.evals.run:main"
eduassist-worker = "eduassist.background.runner:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Chuỗi SQL và văn bản tiếng Việt (email mẫu, mô tả luật) - cắt dòng giữa câu làm khó đọc và khó tìm kiếm
"src/eduassist/services/*" = ["E501"]
"src/eduassist/background/*" = ["E501"]
"src/eduassist/seed/*" = ["E501"]
"src/eduassist/evals/*" = ["E501"]
"src/eduassist/api/platform.py" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Depends() trong tham số mặc định là cách dùng chuẩn của FastAPI
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: cần Postgres đang chạy (docker compose up -d db)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
obs = [
    "langfuse>=5.1.0",
    "sentry-sdk[fastapi]>=2.30.0",
]
ui = [
    "chainlit>=2.12.0",
]
