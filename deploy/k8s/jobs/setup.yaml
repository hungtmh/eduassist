# Migration + role chỉ đọc + tài khoản quản trị (+ dữ liệu mẫu khi SEED=true). scripts/deploy.sh chạy Job này
# TRƯỚC khi cập nhật ứng dụng: migration lỗi thì dừng, phiên bản đang chạy không bị đụng tới.
# Các chỗ __TAG__, __DEMO_MODE__, __NAME__ do script thay.
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  namespace: eduassist
  labels: {app: setup}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: setup, tier: app}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: setup
          image: ghcr.io/hungtmh/eduassist-api:__TAG__
          command: ["eduassist-setup"]
          envFrom:
            - configMapRef: {name: eduassist-config}
            - secretRef: {name: eduassist-secrets}
          env:
            - {name: DEMO_MODE, value: "__DEMO_MODE__"}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1500Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
