# Cùng image và code với api, chỉ nhận /api/chat* và /api/public/chat (Caddy chia). Chat async trả lời dần (SSE):
# tách riêng để LLM chậm không làm chậm trang thường.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-chat
  labels: {app: api-chat, tier: app}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: api-chat}
  template:
    metadata:
      labels: {app: api-chat, tier: app}
    spec:
      automountServiceAccountToken: false
      # Một câu chat được chạy tới 45 giây (CHAT_TURN_TIMEOUT_SECONDS): cho câu đang dở chạy xong rồi mới tắt
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: api-chat}
      containers:
        - name: api-chat
          image: eduassist-api
          command: ["uvicorn", "eduassist.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: eduassist-config}
            - secretRef: {name: eduassist-secrets}
          env:
            - {name: MAX_CONCURRENT_STREAMS, value: "300"}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          startupProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-chat
spec:
  selector: {app: api-chat}
  ports:
    - port: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-chat
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: api-chat}
